<!DOCTYPE html>
<!--
  TIMING CLASH

  This single index.html boots Pyodide (CPython compiled to WebAssembly),
  installs pygame-ce from the Pyodide package index, downloads timing_clash.py
  from the same folder, and runs it in the browser. No bundler, no CI.

  Deploy:  put index.html and timing_clash.py in the repo root, then
           Settings -> Pages -> Deploy from a branch -> main / (root).

  Saves (levels, stars, high scores, settings) persist in the browser via
  IndexedDB, mounted at /persist inside Pyodide.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Timing Clash</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: #140c1c; }
  body {
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 10px; padding: 14px; min-height: 100vh;
    font-family: "Courier New", ui-monospace, monospace; color: #deeed6;
  }
  h1 {
    margin: 0; font-size: clamp(18px, 3.6vw, 30px); letter-spacing: .2em;
    text-transform: uppercase; color: #dad45e; text-shadow: 3px 3px 0 #854c30;
  }
  #status { min-height: 1.4em; font-size: 14px; opacity: .85; text-align: center; }
  #status.error { color: #d04648; opacity: 1; }
  #boot { max-width: 640px; text-align: center; }
  .bar { width: 260px; height: 12px; margin: 14px auto 0; border: 2px solid #8595a1; overflow: hidden; }
  .bar > div { height: 100%; width: 30%; background: #6daa2c; animation: slide 1.1s steps(12) infinite; }
  @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(380%); } }
  #hint { font-size: 12px; opacity: .55; margin-top: 8px; }

  /* SDL renders into this canvas - the id MUST be exactly "canvas". */
  #canvas {
    display: none; outline: none; background: #140c1c;
    width: min(1280px, 96vw, calc((100vh - 120px) * 16 / 9)); height: auto; aspect-ratio: 16 / 9;
    image-rendering: pixelated; image-rendering: crisp-edges;
    border: 4px solid #4e4a4e; box-shadow: 0 0 0 2px #140c1c, 0 0 36px rgba(89, 125, 206, .35);
    touch-action: none;
  }
  #canvas:focus { border-color: #dad45e; }
  #canvas:fullscreen { width: 100vw; height: 100vh; border: 0; box-shadow: none; object-fit: contain; }
  #bar2 { display: none; gap: 10px; align-items: center; font-size: 12px; opacity: .8; }
  #bar2 button {
    font: inherit; color: #140c1c; background: #8595a1; border: 0; padding: 5px 10px; cursor: pointer;
    box-shadow: inset -2px -2px 0 #4e4a4e, inset 2px 2px 0 #deeed6;
  }
  #bar2 button:active { background: #dad45e; }
  #log {
    display: none; max-width: 900px; max-height: 160px; overflow: auto; width: 100%; margin: 0;
    background: #140c1c; border: 1px solid #4e4a4e; padding: 10px; font-size: 12px;
    line-height: 1.4; white-space: pre-wrap; color: #6daa2c;
  }
</style>
</head>
<body>
  <h1>Timing Clash</h1>

  <div id="boot">
    <div id="status">Booting Pyodide (WebAssembly Python)...</div>
    <div class="bar"><div></div></div>
    <div id="hint">First load downloads ~15&nbsp;MB (Python + pygame-ce), then your browser caches it.</div>
  </div>

  <canvas id="canvas" tabindex="0" width="1280" height="720"></canvas>

  <div id="bar2">
    <span>Click the game to focus it &middot; Space / A to strike &middot; P to pause &middot; M to mute</span>
    <button id="fs" type="button">Fullscreen</button>
  </div>
  <pre id="log"></pre>
  <noscript>This game needs JavaScript (it runs Python in WebAssembly).</noscript>

  <script src="https://cdn.jsdelivr.net/pyodide/v0.27.5/full/pyodide.js"></script>
  <script>
  // ====================================================================
  const GAME_FILE = "timing_clash.py";   // the game, sitting next to this file
  const PYODIDE_VERSION = "0.27.5";      // ships pygame-ce
  // ====================================================================

  const $ = id => document.getElementById(id);
  const statusEl = $("status"), bootEl = $("boot"), canvas = $("canvas"), logEl = $("log");
  const setStatus = t => { statusEl.className = ""; statusEl.textContent = t; };
  const setError  = t => { statusEl.className = "error"; statusEl.textContent = t; };
  const printLog  = t => {
    logEl.style.display = "block"; logEl.textContent += t + "\n"; logEl.scrollTop = logEl.scrollHeight;
  };

  // Keep arrows / space from scrolling the page while the game has focus.
  window.addEventListener("keydown", e => {
    if (document.activeElement === canvas &&
        ["Space", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.code)) e.preventDefault();
  }, { passive: false });
  $("fs").addEventListener("click", () => {
    (canvas.requestFullscreen || canvas.webkitRequestFullscreen || (() => {})).call(canvas);
    canvas.focus();
  });
  canvas.addEventListener("click", () => canvas.focus());

  async function fetchGameSource() {
    const url = new URL(GAME_FILE, location.href).href;
    let r = await fetch(url, { cache: "no-cache" });
    if (!r.ok) r = await fetch(url + "?v=" + Date.now());
    if (!r.ok) throw new Error("Could not download " + GAME_FILE + " (HTTP " + r.status + ")");
    return await r.text();
  }

  // Persist saves: IndexedDB-backed filesystem mounted at /persist.
  async function mountSaves(pyodide) {
    try {
      pyodide.FS.mkdirTree("/persist");
      pyodide.FS.mount(pyodide.FS.filesystems.IDBFS, {}, "/persist");
      await new Promise((res, rej) => pyodide.FS.syncfs(true, e => e ? rej(e) : res()));
      const flush = () => { try { pyodide.FS.syncfs(false, () => {}); } catch (_) {} };
      setInterval(flush, 3000);
      document.addEventListener("visibilitychange", () => { if (document.hidden) flush(); });
      window.addEventListener("pagehide", flush);
    } catch (e) {
      console.warn("Save persistence unavailable:", e);   // game still runs, just without saves
    }
  }

  async function boot() {
    try {
      setStatus("Loading Pyodide runtime...");
      const pyodide = await loadPyodide({
        indexURL: `https://cdn.jsdelivr.net/pyodide/v${PYODIDE_VERSION}/full/`,
      });
      pyodide.setStdout({ batched: s => { console.log(s); printLog(s); } });
      pyodide.setStderr({ batched: s => { console.warn(s); printLog(s); } });

      setStatus("Loading pygame-ce...");
      await pyodide.loadPackage(["pygame-ce"], {
        messageCallback: m => { if (m && typeof m === "string") setStatus(m); },
      });

      setStatus("Restoring your save...");
      await mountSaves(pyodide);

      setStatus("Downloading " + GAME_FILE + "...");
      const src = await fetchGameSource();
      pyodide.FS.mkdirTree("/home/web_user/game");
      const gamePath = "/home/web_user/game/" + GAME_FILE;
      pyodide.FS.writeFile(gamePath, src);

      // Bind SDL to our canvas (must happen before pygame.display.set_mode).
      canvas.style.display = "block";
      if (pyodide.canvas && pyodide.canvas.setCanvas2D) pyodide.canvas.setCanvas2D(canvas);

      setStatus("Starting game...");
      // Same as `python timing_clash.py`. In the browser the game schedules its own
      // async frame loop (paced by requestAnimationFrame) and this call returns at once.
      await pyodide.runPythonAsync(`
import os, runpy
os.chdir("/home/web_user/game")
runpy.run_path(${JSON.stringify(gamePath)}, run_name="__main__")
`);

      bootEl.style.display = "none";
      $("bar2").style.display = "flex";
      canvas.focus();
    } catch (err) {
      console.error(err);
      setError("Failed to start: " + (err && err.message ? err.message : err) +
               " - open the browser console (F12) for details.");
    }
  }
  boot();
  </script>
</body>
</html>
