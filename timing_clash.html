  }
}

const CPU_SKILL = { EASY: [0.55, 0.55], NORMAL: [0.33, 0.75], HARD: [0.17, 0.92] };
const P1_CX = 84, P2_CX = 236;

class Duel extends Scene {
  static KO = 12;
  static ROUND_TIME = 30.0;
  constructor(g, cpu = false, wins = null, rnd = 1) {
    super(g);
    this.cpu = cpu;
    this.rnd = rnd;
    this.wins = wins || [0, 0];
    this.best3 = SETTINGS.format === "BEST OF 3";
    const bars = [new TimingBar(24), new TimingBar(W - 24 - BAR_W)];
    for (const b of bars) {
      b.set_speed(90);
      b.zone_h = 24;
      b.new_target();
      b.cursor = Math.random() * BAR_H;
    }
    this.f = [new Fighter(0, bars[0], false, g.assets.hero, "P1"),
              new Fighter(1, bars[1], cpu, g.assets.rival, cpu ? "CPU" : "P2")];
    this.bal = 0;
    this.time_left = Duel.ROUND_TIME;
    this.sudden = false;
    this.phase = "ready";
    this.pt = -0.01;
    this.winner = null;
    this.label = "";
    this.match_over = false;
    this.world = (rnd - 1) % 5;
    this.amb = new Ambient(this.world);
    this.fx = new FX();
    this.t = 0.0;
    this.paused = false;
    this.psel = 0;
  }
  pause() {
    if (this.phase === "ready" || this.phase === "fight") {
      this.paused = true;
      this.psel = 0;
    }
  }
  handle(e) {
    if (e.type !== "keydown") return;
    const g = this.g, k = e.code;
    if (this.paused) {
      pause_input(this, k, () => g.go(new Duel(g, this.cpu)), () => g.go(new TitleScene(g)));
      return;
    }
    if (this.phase === "ready" || this.phase === "fight") {
      if (k === "Escape" || k === "KeyP") this.pause();
      else if (this.phase === "fight") {
        if (k === "KeyA" || (this.cpu && k === "Space")) this.strike(this.f[0]);
        else if (k === "KeyL" && !this.cpu) this.strike(this.f[1]);
      }
    } else if (this.phase === "over" && this.pt > 0.4) {
      if (KEY_ENTER.includes(k) || k === "Space") {
        if (this.match_over) g.go(new Duel(g, this.cpu));
        else g.go(new Duel(g, this.cpu, this.wins, this.rnd + 1));
      } else if (k === "Escape") {
        g.play("back");
        g.go(new TitleScene(g));
      }
    }
  }
  clash_x() {
    return 160 + this.bal * (56.0 / Duel.KO);
  }
  strike(f) {
    const g = this.g;
    const res = f.bar.strike();
    if (res === null) {
      g.play("deny");
      return;
    }
    const cx = this.clash_x();
    f.aim = f.prev = null;
    if (res === "hit" || res === "perfect") {
      const perfect = res === "perfect";
      f.streak += 1;
      const power = 1 + Math.floor(f.streak / 3) + (perfect ? 1 : 0);
      this.bal = clamp(this.bal + (f.idx === 0 ? power : -power), -Duel.KO, Duel.KO);
      f.bar.speed = Math.min(190.0, f.bar.speed + 5);
      f.bar.new_target();
      f.bar.mark(GREEN);
      f.lunge = 0.2;
      const col = f.idx === 0 ? CYAN : ORANGE;
      this.fx.burst(cx, GROUND_Y - 10, col, perfect ? 12 : 7, 60);
      const bx = f.bar.x + Math.floor(BAR_W / 2);
      this.fx.text(bx, BAR_Y - 8, "+" + power, perfect ? YELLOW : CREAM, 1, 0.7);
      g.play(perfect ? "crit" : "hit");
      if (perfect || f.streak % 3 === 0) g.add_shake(0.1);
      if (Math.abs(this.bal) >= Duel.KO) this.end_round(this.bal > 0 ? 0 : 1, "K.O.!");
      else if (this.sudden && this.bal !== 0) this.end_round(this.bal > 0 ? 0 : 1, "SUDDEN DEATH!");
    } else {
      f.streak = 0;
      f.bar.freeze = SETTINGS.hardcore ? 2.0 : 1.0;
      f.bar.mark(RED);
      this.fx.text(f.bar.x + Math.floor(BAR_W / 2), BAR_Y - 8, "MISS", RED, 1, 0.7);
      g.play("miss");
    }
  }
  end_round(winner, label) {
    this.phase = "ko";
    this.pt = 0.0;
    this.winner = winner;
    this.label = label;
    if (winner !== null) this.wins[winner] += 1;
    this.match_over = (!this.best3) || Math.max(this.wins[0], this.wins[1]) >= 2;
    this.g.play("ko");
    this.g.add_shake(0.4);
    const cx = this.clash_x();
    this.fx.burst(cx, GROUND_Y - 10, YELLOW, 30, 110, 40, 0.8, 2);
  }
  cpu_act(f) {
    const b = f.bar;
    if (b.freeze > 0) {
      f.aim = f.prev = null;
      return;
    }
    const [sigma, prob] = CPU_SKILL[SETTINGS.difficulty];
    const [zy, zh] = b.zone();
    if (f.aim === null) {
      f.aim = zy + zh / 2 + new Random(Date.now() & 0xffff).gauss(0, sigma * zh);
      f.prev = null;
    }
    const rel = b.cursor - f.aim;
    const crossed = f.prev !== null && f.prev * rel <= 0 && f.prev !== rel;
    f.prev = rel;
    if (crossed) {
      if (Math.random() < prob) this.strike(f);
      else f.aim = null;
    }
  }
  update(dt) {
    this.fx.update(dt);
    if (this.paused) return;
    this.t += dt;
    this.amb.update(dt);
    for (const f of this.f) f.lunge = Math.max(0.0, f.lunge - dt);
    if (this.phase === "ready") {
      for (const f of this.f) f.bar.update(dt);
      this.pt = countdown_step(this.g, this.pt, dt);
      if (this.pt >= 2.0) this.phase = "fight";
    } else if (this.phase === "fight") {
      for (const f of this.f) f.bar.update(dt);
      for (const f of this.f)
        if (f.cpu && this.phase === "fight") this.cpu_act(f);
      if (this.phase === "fight" && !this.sudden) {
        this.time_left -= dt;
        if (this.time_left <= 0) {
          this.time_left = 0;
          if (this.bal !== 0) this.end_round(this.bal > 0 ? 0 : 1, "TIME!");
          else {
            this.sudden = true;
            this.fx.text(Math.floor(W / 2), 60, "SUDDEN DEATH!", RED, 2, 1.6);
            this.g.play("deny");
          }
        }
      }
    } else if (this.phase === "ko") {
      this.pt += dt;
      if (this.pt >= 1.6) {
        this.phase = "over";
        this.pt = 0.0;
      }
    } else {
      this.pt += dt;
    }
  }
  draw_beam(s, x0, x1, cols, flip) {
    if (x1 <= x0) return;
    const y = GROUND_Y - 13;
    fillRect(s, cols[0], x0, y, x1 - x0, 6);
    fillRect(s, cols[1], x0, y + 1, x1 - x0, 4);
    fillRect(s, cols[2], x0, y + 2, x1 - x0, 2);
    const off = Math.floor(this.t * 90) % 12;
    for (let x = x0 - 12 + (flip ? 12 - off : off); x < x1; x += 12) {
      const a = Math.max(x, x0), b = Math.min(x + 4, x1);
      if (b > a) fillRect(s, cols[0], a, y + 2, b - a, 2);
    }
  }
  draw_fighter(s, f, cx) {
    const sign = f.idx === 0 ? 1 : -1;
    let off = f.lunge > 0 ? Math.floor(Math.sin((1 - f.lunge / 0.2) * Math.PI) * 6) * sign : 0;
    let tint = null, bob = Math.floor(this.t * 3) % 2, up = 0;
    if ((this.phase === "ko" || this.phase === "over") && this.winner !== null) {
      if (f.idx !== this.winner) {
        off = -sign * Math.floor(Math.min(this.pt, 1.2) * 70);
        tint = Math.floor(this.t * 20) % 2 ? RED : CREAM;
        bob = 0;
      } else {
        up = Math.floor(Math.abs(Math.sin(this.pt * 8)) * 6);
      }
    }
    shade(s, [cx - 6 + off, GROUND_Y - 1, 12, 3], 100);
    blit(s, f.spr.get(f.idx === 1, tint), cx - 8 + off, GROUND_Y - 16 - bob - up);
  }
  draw(s) {
    const g = this.g;
    blit(s, g.assets.background(this.world), 0, 0);
    this.amb.draw(s);
    this.draw_fighter(s, this.f[0], P1_CX);
    this.draw_fighter(s, this.f[1], P2_CX);
    const cx = Math.floor(this.clash_x());
    this.draw_beam(s, P1_CX + 10, cx, [BLUE, CYAN, CREAM], false);
    this.draw_beam(s, cx, P2_CX - 10, [RED, ORANGE, YELLOW], true);
    const r = 6 + Math.floor(Math.sin(this.t * 30) * 1.5);
    drawCircle(s, YELLOW, cx, GROUND_Y - 10, r);
    drawCircle(s, CREAM, cx, GROUND_Y - 10, Math.max(2, r - 3));
    this.f[0].bar.draw(s, CYAN);
    this.f[1].bar.draw(s, ORANGE);
    this.fx.draw(s);
    // HUD: tug meter
    const mx = 80, my = 20, mw = 160;
    fillRect(s, BLACK, mx - 2, my - 2, mw + 4, 10);
    const frac = (this.bal + Duel.KO) / (2.0 * Duel.KO);
    const split = Math.floor(mw * frac);
    fillRect(s, CYAN, mx, my, split, 6);
    fillRect(s, RED, mx + split, my, mw - split, 6);
    fillRect(s, CREAM, mx + split - 1, my - 2, 2, 10);
    fillRect(s, BLACK, mx + Math.floor(mw / 2), my, 1, 6);
    const secs = this.sudden ? "SUDDEN DEATH" : String(Math.ceil(this.time_left));
    text(s, secs, Math.floor(W / 2), 4, (this.sudden || this.time_left < 5) ? RED : CREAM,
         this.sudden ? 1 : 2, "center", BLACK);
    text(s, "P1", 8, 4, CYAN, 2, "left", BLACK);
    text(s, this.f[1].name, W - 8, 4, ORANGE, 2, "right", BLACK);
    if (this.best3) {
      for (let k = 0; k < 2; k++) {
        fillRect(s, k < this.wins[0] ? YELLOW : PLUM, 8 + k * 8, 18, 6, 6);
        fillRect(s, k < this.wins[1] ? YELLOW : PLUM, W - 14 - k * 8, 18, 6, 6);
      }
      text(s, "ROUND " + this.rnd, Math.floor(W / 2), 30, GRAY, 1, "center");
    }
    const keys = [[this.f[0], "[A]"], [this.f[1], this.cpu ? "CPU" : "[L]"]];
    for (const [f, key] of keys) {
      const cxb = f.bar.x + Math.floor(BAR_W / 2);
      if (f.streak >= 2)
        text(s, "STREAK X" + f.streak, cxb, GROUND_Y + 8, ORANGE, 1, "center", BLACK);
      text(s, key, cxb, GROUND_Y + 18, GRAY, 1, "center");
    }
    if (this.phase === "ready") draw_countdown(s, this.pt);
    if (this.phase === "ko" || this.phase === "over") {
      if (this.pt < 1.6 || this.phase === "ko")
        text(s, this.label, Math.floor(W / 2), 60, YELLOW, 5, "center", RED);
    }
    if (this.phase === "over" && this.pt > 0.15) this.draw_result(s);
    if (this.paused) draw_pause(s, this.psel);
  }
  draw_result(s) {
    shade(s, [0, 0, W, H], 120);
    panel(s, 50, 42, 220, 92, NAVY, YELLOW);
    const w = this.winner;
    let head, col;
    if (w === null) { head = "DRAW!"; col = CREAM; }
    else {
      const nm = this.f[w].name;
      head = (this.match_over && this.best3) ? nm + " WINS THE MATCH!" : nm + " WINS!";
      col = w === 0 ? CYAN : ORANGE;
    }
    text(s, head, Math.floor(W / 2), 50, col, 2, "center", BLACK);
    if (this.best3)
      text(s, "SCORE  " + this.wins[0] + " - " + this.wins[1], Math.floor(W / 2), 74, CREAM, 2, "center");
    else
      text(s, "FINAL PUSH " + (this.bal >= 0 ? "+" : "") + this.bal, Math.floor(W / 2), 76, CREAM, 1, "center");
    const hint = this.match_over ? "ENTER: REMATCH" : "ENTER: NEXT ROUND";
    text(s, hint, Math.floor(W / 2), 104, YELLOW, 1, "center");
    text(s, "ESC: MENU", Math.floor(W / 2), 116, GRAY, 1, "center");
  }
}

// ------------------------------------------------------------------------ game
class Game {
  constructor() {
    this.canvas = makeSurface(W, H);
    this.window = document.getElementById("screen");
    this.window.width = W * START_SCALE;
    this.window.height = H * START_SCALE;
    this.resize();
    this.save = _saveCache;
    // pull real progress from the CrazyGames Data module (or localStorage
    // fallback) asynchronously, then rebuild assets/settings once it lands
    load_save().then(save => {
      this.save = save;
      _saveCache = save;
      this.assets.set_hero(save.hero);
      this.run_hp = this.max_hearts();
    });
    this.assets = new Assets(this.save.hero);
    this.audio = new Audio();
    this.run_hp = this.max_hearts();
    this.run_score = 0;
    this.shake = 0.0;
    this.view = [0, 0, START_SCALE];
    this._scan = null;
    this.fullscreen = false;
    this.mouse = [0, 0];
    this.mouseButtons = [false, false, false];
    this.scene = new TitleScene(this);
  }
  // services used by scenes
  play(name) { this.audio.play(name); }
  go(scene) { this.scene = scene; }
  max_hearts() { return 5 + (this.save.upgrades.vitality || 0); }
  save_now() { write_save(this.save); }
  add_shake(t) { this.shake = Math.max(this.shake, t); }
  mouse_pos() {
    const [ox, oy, sc] = this.view;
    return [Math.floor((this.mouse[0] - ox) / sc), Math.floor((this.mouse[1] - oy) / sc)];
  }
  start_run(level) {
    this.run_hp = this.max_hearts();
    this.run_score = 0;
    this.go(new Battle(this, level));
  }
  reset_progress() {
    this.save = { highest: 1, coins: 0, best_score: 0, upgrades: {}, stars: {}, hero: null };
    this.assets.set_hero(null);
    this.run_hp = this.max_hearts();
    this.run_score = 0;
    this.save_now();
  }
  quit() {
    this.save_now();
    document.body.innerHTML =
      '<div style="color:#deeed6;font-family:monospace;display:flex;height:100vh;' +
      'align-items:center;justify-content:center;background:#140c1c">' +
      "THANKS FOR PLAYING &mdash; close or reload this tab to return to the title.</div>";
  }
  toggle_fullscreen() {
    this.fullscreen = !this.fullscreen;
    try {
      if (this.fullscreen) {
        const p = this.window.requestFullscreen && this.window.requestFullscreen();
        if (p && p.catch) p.catch(() => {});
      } else if (document.exitFullscreen && document.fullscreenElement) {
        const p = document.exitFullscreen();
        if (p && p.catch) p.catch(() => {});
      }
    } catch (err) { /* fullscreen unsupported */ }
  }
  resize() {
    if (this.fullscreen) {
      this.window.width = window.innerWidth;
      this.window.height = window.innerHeight;
      this.window.style.width = window.innerWidth + "px";
      this.window.style.height = window.innerHeight + "px";
    } else {
      const ww = window.innerWidth, wh = window.innerHeight;
      const sc = Math.max(1, Math.min(Math.floor(ww / W), Math.floor(wh / H)));
      this.window.width = W * sc;
      this.window.height = H * sc;
      this.window.style.width = W * sc + "px";
      this.window.style.height = H * sc + "px";
    }
    const ctx = this.window.getContext("2d");
    ctx.imageSmoothingEnabled = false;
  }
  present() {
    const win = this.window;
    const ww = win.width, wh = win.height;
    const sc = Math.max(1, Math.min(Math.floor(ww / W), Math.floor(wh / H)));
    const vw = W * sc, vh = H * sc;
    const ox = Math.floor((ww - vw) / 2), oy = Math.floor((wh - vh) / 2);
    this.view = [ox, oy, sc];
    const ctx = win.getContext("2d");
    ctx.imageSmoothingEnabled = false;
    ctx.fillStyle = rgb(BLACK);
    ctx.fillRect(0, 0, ww, wh);
    let sx = 0, sy = 0;
    if (this.shake > 0 && SETTINGS.shake) {
      sx = (Math.floor(Math.random() * 5) - 2) * sc;   // randint(-2, 2) * sc
      sy = (Math.floor(Math.random() * 5) - 2) * sc;
    }
    ctx.drawImage(this.canvas, ox + sx, oy + sy, vw, vh);
    if (SETTINGS.scanlines && sc >= 2) {
      if (this._scan === null || this._scan[0][0] !== vw || this._scan[0][1] !== vh) {
        const sl = makeSurface(vw, vh);
        const sctx = sl.getContext("2d");
        sctx.fillStyle = "rgba(0,0,0," + (55 / 255) + ")";
        for (let y = sc - 1; y < vh; y += sc) sctx.fillRect(0, y, vw, 1);
        this._scan = [[vw, vh], sl];
      }
      ctx.drawImage(this._scan[1], ox, oy);
    }
  }
  handleEvent(e) {
    if (e.type === "keydown" &&
        (e.code === "F11" || (KEY_ENTER.includes(e.code) && e.altKey))) {
      this.toggle_fullscreen();
      return;
    }
    this.scene.handle(e);
  }
  run() {
    let last = performance.now();
    const frame = () => {
      const now = performance.now();
      const dt = Math.min(0.05, (now - last) / 1000.0);
      last = now;
      if (this.shake > 0) this.shake -= dt;
      const scene = this.scene;
      scene.update(dt);
      scene.draw(this.canvas);
      if (SETTINGS.fps)
        text(this.canvas, "FPS " + Math.round(this.fps), 4, 172, GREEN, 1, "left", BLACK);
      this.present();
      this._fpsAcc = (this._fpsAcc || 0) + 1;
      if (now - (this._fpsT || now) >= 500) {
        this.fps = this._fpsAcc * 1000 / (now - this._fpsT);
        this._fpsT = now;
        this._fpsAcc = 0;
      }
      requestAnimationFrame(frame);
    };
    requestAnimationFrame(frame);
  }
}

// ------------------------------------------------------------------ bootstrap
const GAME = new Game();

const PREVENT = new Set(["Space", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight",
                         "Enter", "NumpadEnter", "Backspace", "Tab", "F11"]);

window.addEventListener("keydown", (e) => {
  if (PREVENT.has(e.code) || (e.code === "Enter" && e.altKey)) e.preventDefault();
  if (e.repeat) return;
  GAME.handleEvent(e);
  GAME.window.focus();
});
window.addEventListener("keyup", (e) => {
  if (PREVENT.has(e.code)) e.preventDefault();
});
GAME.window.addEventListener("mousemove", (e) => {
  const rect = GAME.window.getBoundingClientRect();
  const sx = GAME.window.width / rect.width, sy = GAME.window.height / rect.height;
  GAME.mouse = [(e.clientX - rect.left) * sx, (e.clientY - rect.top) * sy];
});
GAME.window.addEventListener("mousedown", (e) => {
  e.preventDefault();
  if (e.button === 0) GAME.mouseButtons[0] = true;
  if (e.button === 2) GAME.mouseButtons[2] = true;
  GAME.handleEvent({ type: "mousedown", button: e.button, code: "" });
  GAME.window.focus();
});
window.addEventListener("mouseup", (e) => {
  if (e.button === 0) GAME.mouseButtons[0] = false;
  if (e.button === 2) GAME.mouseButtons[2] = false;
});
GAME.window.addEventListener("contextmenu", (e) => e.preventDefault());
window.addEventListener("resize", () => GAME.resize());
document.addEventListener("fullscreenchange", () => {
  GAME.fullscreen = !!document.fullscreenElement;
  GAME.resize();
});
window.addEventListener("blur", () => {
  if (typeof GAME.scene.pause === "function") GAME.scene.pause();
});

GAME.run();
</script>
